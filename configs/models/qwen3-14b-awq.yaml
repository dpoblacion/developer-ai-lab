# Qwen3-14B AWQ (4-bit, dense) — MODEL axis only. Sibling of qwen3-14b-fp8.yaml for
# Ampere hardware (a40/a100-80gb, no native FP8) and for squeezing more KV cache out of
# 24GB cards (l4). UNVALIDATED on a pod yet.
family: qwen3-14b
quant: awq
model: Qwen/Qwen3-14B-AWQ
served_model_name: qwen3-14b-awq
vllm_version: "0.11.0"
image: runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404
container_disk_gb: 60
pip_constraints:
  - "transformers<5"          # vLLM 0.11.0's tokenizer code predates the transformers 5.x API
tool_call_parser: hermes      # same family → same streaming-parser caveat as the fp8 variant
reasoning_parser: qwen3       # strip the thinking block from replies
enable_auto_tool_choice: true
extra_args:
  # Qwen3's native context is 40960 — below the benchmark's 65536 window. Qwen's
  # documented recipe for longer contexts is YaRN scaling (2.0 × 32768 = 65536).
  - "--rope-scaling"
  - '{"rope_type":"yarn","factor":2.0,"original_max_position_embeddings":32768}'
env:
  VLLM_USE_FLASHINFER_SAMPLER: "0"
# Architecture metadata (HF model card: 14.8B total, dense)
architecture: dense
total_params_b: 14.8
active_params_b: 14.8
