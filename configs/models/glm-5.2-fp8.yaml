# GLM-5.2 FP8 (~753B MoE, ~744GB weights) — MODEL axis only. Needs 8×H200 (--gpus 8);
# tensor_parallel_size is derived from the run's --gpus.
#
# The official vllm/vllm-openai image has NO sshd (it's an app image, not a RunPod base) —
# the harness needs SSH for rsync + scripts — so we use an SSH-capable runpod/pytorch base
# and pip-install vLLM 0.23 in the venv. vLLM 0.23's PyPI wheel (vllm._C) is built for
# CUDA 13 (needs libcudart.so.13), so the base image must be CUDA 13 too — a cu129 base
# fails at import with "libcudart.so.13: cannot open shared object file" (seen live
# 2026-07-03). Everything aligned to CUDA 13: cu130 image + vLLM/torch default wheels, no
# extra index. Tag verified on Docker Hub (runpod/pytorch tags API).
family: glm-5.2
quant: fp8
model: zai-org/GLM-5.2-FP8
served_model_name: glm-5.2-fp8
vllm_version: "0.23.0"
image: runpod/pytorch:1.0.7-cu1300-torch291-ubuntu2404   # CUDA 13 (matches vLLM's wheel)
container_disk_gb: 800                       # ~744GB FP8 weights + KV/runtime overhead
kv_cache_dtype: fp8
tool_call_parser: glm47
reasoning_parser: glm45
enable_auto_tool_choice: true
extra_args:
  - --speculative-config.method
  - mtp
  - --speculative-config.num_speculative_tokens
  - "5"
env:
  VLLM_USE_FLASHINFER_SAMPLER: "0"
