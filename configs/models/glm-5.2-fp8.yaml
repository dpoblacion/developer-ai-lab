# GLM-5.2 FP8 (~753B MoE, ~744GB weights) — MODEL axis only. Needs 8×H200 (--gpus 8);
# tensor_parallel_size is derived from the run's --gpus.
#
# The official vllm/vllm-openai image was tried first but has NO sshd (it's an app image,
# not a RunPod base) — the harness needs SSH for rsync + scripts, so it failed at
# "SSH did not become available" (2026-07-03). So: an SSH-capable runpod/pytorch base with
# CUDA 12.9, and vLLM 0.23 installed via pip in the venv. vLLM 0.23 defaults to CUDA-13
# wheels; pip_extra_index_url pins the cu129 build to match the image/driver.
# ⚠️ VERIFY THE IMAGE TAG EXISTS on RunPod/Docker Hub before the first run.
family: glm-5.2
quant: fp8
model: zai-org/GLM-5.2-FP8
served_model_name: glm-5.2-fp8
vllm_version: "0.23.0"
image: runpod/pytorch:1.0.5-cu1290-torch290-ubuntu2204   # ⚠️ verify tag before running
container_disk_gb: 800                       # ~744GB FP8 weights + KV/runtime overhead
pip_extra_index_url: https://download.pytorch.org/whl/cu129   # match vLLM's torch to CUDA 12.9
kv_cache_dtype: fp8
tool_call_parser: glm47
reasoning_parser: glm45
enable_auto_tool_choice: true
extra_args:
  - --speculative-config.method
  - mtp
  - --speculative-config.num_speculative_tokens
  - "5"
env:
  VLLM_USE_FLASHINFER_SAMPLER: "0"
