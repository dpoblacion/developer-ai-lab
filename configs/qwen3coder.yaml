model: Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8

served_model_name: qwen3-coder-30b-fp8

vllm_version: "0.11.0"   # matches the pod image's torch 2.8.0 / CUDA 12.8 host driver
pip_constraints:
  - "transformers<5"     # vLLM 0.11.0's tokenizer code predates the transformers 5.x API

host: 0.0.0.0
port: 8000

download_dir: /workspace/huggingface

gpu_memory_utilization: 0.92
max_model_len: 32768
max_num_seqs: 8

# Tool calling (Claude Code sends tools): required for the agent to work.
# qwen3_xml, not qwen3_coder: the qwen3_coder parser leaves Qwen3-Coder's tool calls in
# the message content (tool_calls stays empty) — a known vLLM bug for this model. The vLLM
# docs list qwen3_xml as the parser for Qwen3-Coder-30B-A3B-Instruct; it ships in 0.11.0.
tool_call_parser: qwen3_xml
enable_auto_tool_choice: true

env:
  VLLM_USE_FLASHINFER_SAMPLER: "0"