name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo and runs offline checks — no deploy, no secrets.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pyyaml
      - name: Run the unit suite
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ruff
        run: |
          pip install ruff
          ruff check .

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dashboard dependencies
        run: pip install -r requirements-report.txt pyyaml
      - name: Render smoke tests (AppTest, headless)
        run: python -m unittest tests.test_dashboard_render -v
